[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-eval-agent"
version = "0.2.0"
description = "Continuous evaluation agent for LLM products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "httpx>=0.27",
    "openai>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
eval-agent = "eval_agent.cli:main"

[tool.setuptools.packages.find]
include = ["eval_agent*"]
